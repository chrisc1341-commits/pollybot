name: pollybot
version: 0.1.83
description: AI-powered polling and prediction skill for Bullpen
author: BullpenFi

triggers:
  - command: poll
    description: Create a market poll or prediction question
  - command: predict
    description: Generate a probability-weighted prediction
  - command: sentiment
    description: Summarise market sentiment for a ticker or topic
  - command: portfolio balances
    description: Fetch token balances across all linked wallets and chains
  - command: polymarket discover
    description: List trending prediction markets on Polymarket
  - command: polymarket buy
    description: Buy shares on a Polymarket prediction market outcome

skills:
  - name: poll
    file: skills/poll.yaml
  - name: predict
    file: skills/predict.yaml
  - name: sentiment
    file: skills/sentiment.yaml
  - name: portfolio-balances
    file: skills/portfolio/balances.yaml
  - name: polymarket-discover
    file: skills/polymarket/discover.yaml
  - name: polymarket-buy
    file: skills/polymarket/buy.yaml
